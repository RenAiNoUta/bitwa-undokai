<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitwa Undōkai</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="#d9443b"/%3E%3Cpath d="M32 9c4 0 6.6 2.6 9 6.6l12.6 22.6c2.7 5-1 12.3-7.8 12.3H18.2c-6.8 0-10.5-7.3-7.8-12.3L23 15.6C25.4 11.6 28 9 32 9z" fill="#fffdf6" stroke="#2b2520" stroke-width="3.5" stroke-linejoin="round"/%3E%3Crect x="21" y="34" width="22" height="17" rx="2.5" fill="#2d3b2e"/%3E%3Ccircle cx="26" cy="27" r="2.3" fill="#2b2520"/%3E%3Ccircle cx="38" cy="27" r="2.3" fill="#2b2520"/%3E%3Cellipse cx="22" cy="31" rx="2.6" ry="1.6" fill="#ff8fa3"/%3E%3Cellipse cx="42" cy="31" rx="2.6" ry="1.6" fill="#ff8fa3"/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  /* Layout: full-bleed school playfield; wooden name-plate HUD on top, chalkboard command panel docked at the bottom */
  --field:#86a862; --board:#2c4a3d; --board-hi:#3a5e4e; --chalk:#f1eee3; --chalk-dim:#bccabd;
  --wood:#b9824d; --wood-dk:#7b5330; --paper:#fbf5e5; --paper-edge:#d8cba9; --ink:#2b2520;
  --aka:#d9443b; --aka-dk:#8f2620; --gold:#f2c14e;
  --f-display:"Dela Gothic One","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
[hidden]{display:none!important}
body{background:var(--field);color:var(--chalk);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#game{position:absolute;inset:0}
#game canvas{display:block}

#hud{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.plate{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;background:var(--wood);color:var(--paper);border:2px solid var(--wood-dk);border-radius:7px;box-shadow:0 3px 0 var(--wood-dk);font:800 14px/1 var(--f-body);font-variant-numeric:tabular-nums}
.plate .lbl{font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.plate.team{background:var(--aka);border-color:var(--aka-dk);box-shadow:0 3px 0 var(--aka-dk);font-family:var(--f-display);font-weight:400;font-size:15px}
.plate svg{width:18px;height:18px}
button.plate{cursor:pointer}
button.plate.icon{padding:0 8px}
button.plate.icon[aria-pressed="false"]{opacity:.55}
button.plate.icon[aria-pressed="false"] .on-only{display:none}
button.plate.icon[aria-pressed="true"] .off-only{display:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lang{pointer-events:auto;display:inline-flex;height:34px;border:2px solid var(--wood-dk);border-radius:7px;overflow:hidden;box-shadow:0 3px 0 var(--wood-dk);background:var(--wood)}
.lang button{border:0;background:transparent;color:var(--paper);font:800 12px/1 var(--f-body);letter-spacing:.06em;padding:0 9px;cursor:pointer;min-width:36px}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.card .lang{float:right;margin:-4px 0 6px 10px;border-color:var(--ink);box-shadow:0 3px 0 var(--ink);background:#f1e7cf}
.card .lang button{color:var(--ink)}
.card .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (max-width:480px){.plate .lbl{display:none}.plate{padding:0 8px}}

#panel{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:16px;align-items:flex-start;min-height:112px;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(circle at 18% 30%,rgba(255,255,255,.05),transparent 40%),radial-gradient(circle at 78% 70%,rgba(255,255,255,.04),transparent 45%),var(--board);border-top:8px solid var(--wood);box-shadow:0 -3px 0 var(--wood-dk)}
#sel{flex:1 1 240px;min-width:0;max-width:440px}
#actions{flex:2 1 300px;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
#sel h2{font:800 17px/1.2 var(--f-body);margin:0 0 4px;color:var(--chalk);text-wrap:balance}
.muted{color:var(--chalk-dim);font-size:13px;line-height:1.45;margin:0;max-width:60ch}
.who{display:flex;gap:10px;align-items:flex-start}
.who img{flex:none;width:52px;height:60px;object-fit:contain;background:var(--board-hi);border-radius:8px;border:2px dashed rgba(241,238,227,.3)}
.who>div{min-width:0}
.role{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 5px;font-weight:800}
.hp{width:140px;max-width:100%;height:9px;border:1.5px solid var(--chalk);border-radius:5px;overflow:hidden;margin-bottom:6px}
.hp i{display:block;height:100%;width:100%;background:#8fd88a}
.hp.enemy i{background:#8fa8e0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--board-hi);border-radius:6px;padding:2px 9px 2px 2px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.chip img{width:30px;height:34px;object-fit:contain}
.act{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:4px 11px 4px 4px;background:var(--paper);color:var(--ink);border:0;border-radius:6px;box-shadow:0 3px 0 var(--paper-edge);font:800 13px/1.15 var(--f-body);cursor:pointer;text-align:left}
.act img{width:34px;height:40px;object-fit:contain}
.act span{display:flex;flex-direction:column;gap:2px}
.act small{display:flex;gap:4px;align-items:center;color:#6b5d4b;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.act small svg{width:12px;height:12px}
.act.plain{padding:4px 14px}
.act.on{background:var(--gold);box-shadow:0 3px 0 #b88a1f}
.act.poor{opacity:.5}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--paper-edge)}
.queue{display:flex;gap:4px;align-items:center;flex-basis:100%}
.qi{position:relative;width:34px;height:38px;background:var(--board-hi);border-radius:6px;display:grid;place-items:center;overflow:hidden}
.qi img{width:30px;height:34px;object-fit:contain}
.qi i{position:absolute;left:0;bottom:0;height:4px;width:0;background:#9fd3ff}
@media (max-width:640px){
  #panel{flex-direction:column;gap:8px;min-height:0;padding-block:8px 10px}
  #sel{flex:none;max-width:none;width:100%}
  #actions{flex:none;width:100%}
  .who .desc{display:none}
  .who img{width:40px;height:46px}
}

#toast{position:absolute;top:calc(var(--hud-h,52px) + 8px);left:max(16px,env(safe-area-inset-left,0px));z-index:3;max-width:min(420px,calc(100% - 190px));background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:8px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800;font-size:14px;line-height:1.35;pointer-events:none}
#toast.show{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.show{animation:none}}
#pauseBanner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:10px;padding:12px 26px;font:400 26px var(--f-display);pointer-events:none}

.screen{position:absolute;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(28,44,37,.6)}
.card{width:min(560px,100%);background:var(--paper);color:var(--ink);border-radius:10px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.kohaku{height:12px;background:repeating-linear-gradient(90deg,var(--aka) 0 22px,#fff 22px 44px);border-bottom:2px solid var(--ink)}
.card-in{padding:16px 22px 20px}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--aka);margin:0 0 4px}
.card h1{font:400 clamp(32px,8vw,46px)/1.05 var(--f-display);margin:0 0 10px;text-wrap:balance}
.card h1.plain{font-family:var(--f-body);font-weight:800}
.lede{font-size:15px;line-height:1.55;margin:0 0 14px;max-width:60ch}
.roster{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.roster li{background:#f1e7cf;border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:12px;line-height:1.35;min-width:0}
.roster img{width:46px;height:54px;object-fit:contain}
.roster b{font-size:14px}
.howto{font-size:13px;line-height:1.5;color:#4a4036;margin:0 0 14px;display:grid;gap:4px}
.howto b{color:var(--ink)}
.diff{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.diff button{flex:1 1 0;min-height:42px;border:2px solid var(--ink);background:transparent;border-radius:8px;font:800 14px var(--f-body);color:var(--ink);cursor:pointer}
.diff button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.go{width:100%;min-height:52px;border:0;border-radius:8px;background:var(--aka);color:#fff;font:400 20px var(--f-display);box-shadow:0 4px 0 var(--aka-dk);cursor:pointer}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--aka-dk)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.stats div{flex:1 1 100px;background:#f1e7cf;border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b5d4b;font-weight:800}
@media (max-width:440px){.roster{grid-template-columns:1fr}.roster li{flex-direction:row;text-align:left;gap:10px}}
</style>
</head>
<body>

<div id="app">
  <div id="game"></div>

  <header id="hud">
    <div class="plate team" data-i18n-title="hud.team">赤組</div>
    <div class="plate" data-i18n-title="hud.onigiri"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5c1.3 0 2.2.9 3 2.2l4.3 7.6c.9 1.7-.3 4.2-2.6 4.2H5.3c-2.3 0-3.5-2.5-2.6-4.2L7 4.7c.8-1.3 1.7-2.2 3-2.2z" fill="#fffdf6" stroke="#3b2a1f" stroke-width="1.5"/><rect x="6.6" y="11.2" width="6.8" height="5.3" rx="1" fill="#2d3b2e"/></svg><b id="res">200</b></div>
    <div class="plate"><span class="lbl" data-i18n="hud.pop"></span><b id="pop">3/10</b></div>

    <button class="plate" id="pause" type="button"></button>
    <button class="plate icon" id="sfxBtn" type="button" aria-pressed="true" data-i18n-title="hud.sfx" data-i18n-aria="hud.sfx"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="#fbf5e5"/><path class="on-only" d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="#fbf5e5" stroke-width="1.8" stroke-linecap="round"/><path class="off-only" d="M13 7.5l5 5m0-5l-5 5" stroke="#fbf5e5" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="plate icon" id="musBtn" type="button" aria-pressed="true" data-i18n-title="hud.music" data-i18n-aria="hud.music"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 14.5V4.5l8-2v10" fill="none" stroke="#fbf5e5" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6" cy="14.8" r="2.4" fill="#fbf5e5"/><circle cx="14" cy="12.8" r="2.4" fill="#fbf5e5"/><path class="off-only" d="M3 3l14 14" stroke="#fbf5e5" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="lang" role="group" data-lang-group></div>
  </header>

  <section id="panel" data-i18n-aria="panel.aria">
    <div id="sel"></div>
    <div id="actions"></div>
  </section>

  <div id="toast" role="status" hidden></div>
  <div id="pauseBanner" hidden data-i18n="pause.banner"></div>

  <div class="screen" id="start">
    <div class="card">
      <div class="kohaku"></div>
      <div class="card-in">
        <div class="lang" role="group" data-lang-group></div>
        <p class="eyebrow" data-i18n="start.eyebrow"></p>
        <h1 data-i18n="start.title"></h1>
        <p class="lede" data-i18n="start.lede"></p>
        <ul class="roster">
          <li><img data-port="tanuki0" alt=""><div><b>Tanuki</b><br><span data-i18n="roster.tanuki"></span></div></li>
          <li><img data-port="shiba0" alt=""><div><b>Shiba</b><br><span data-i18n="roster.shiba"></span></div></li>
          <li><img data-port="kitsune0" alt=""><div><b>Kitsune</b><br><span data-i18n="roster.kitsune"></span></div></li>
        </ul>
        <div class="howto">
          <div data-i18n-html="howto.mouse"></div>
          <div data-i18n-html="howto.touch"></div>
        </div>
        <div class="diff" role="group" data-i18n-aria="diff.aria">
          <button type="button" data-diff="latwy" aria-pressed="false" data-i18n="diff.latwy"></button>
          <button type="button" data-diff="normalny" aria-pressed="true" data-i18n="diff.normalny"></button>
          <button type="button" data-diff="trudny" aria-pressed="false" data-i18n="diff.trudny"></button>
        </div>
        <button class="go" id="go" type="button" data-i18n="start.go"></button>
      </div>
    </div>
  </div>

  <div class="screen" id="end" hidden>
    <div class="card">
      <div class="kohaku"></div>
      <div class="card-in">
        <p class="eyebrow" id="endEyebrow"></p>
        <h1 class="plain" id="endTitle"></h1>
        <p class="lede" id="endText"></p>
        <div class="stats">
          <div><b id="stTime">0:00</b><span data-i18n="hud.time"></span></div>
          <div><b id="stTrained">0</b><span data-i18n="end.trained"></span></div>
          <div><b id="stKo">0</b><span data-i18n="end.ko"></span></div>
        </div>
        <button class="go" id="again" type="button" data-i18n="end.again"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>

  /* ---------- simulation ---------- */
  step(u,x,y,dt,arrive){
    let dx=x-u.x,dy=y-u.y;const d=Math.hypot(dx,dy);
    if(d<=arrive+1){u.moving=false;return true;}
    dx/=d;dy/=d;
    if(u.detT>0){u.detT-=dt;const a=u.detDir*1.25,cs=Math.cos(a),sn=Math.sin(a);const nx=dx*cs-dy*sn,ny=dx*sn+dy*cs;dx=nx;dy=ny;}
    const k=1/Math.sqrt(dx*dx+(dy/VERT)*(dy/VERT));
    const mv=Math.min(d,UNITS[u.type].spd*k*dt);u.x+=dx*mv;u.y+=dy*mv;u.want=mv;
    if(Math.abs(dx)>.15)u.face=dx<0?-1:1;u.moving=true;return false;
  }
  updUnit(u,dt){
    const D=UNITS[u.type],combat=u.type!=='tanuki';
    u.cd-=dt;if(u.swing>0)u.swing-=dt;u.moving=false;u.want=0;u.px=u.x;u.py=u.y;
    if(combat&&(u.state==='idle'||(u.state==='move'&&u.amove))){
      const e=this.nearestEnemy(u,u.state==='idle'?170:200);
      if(e){u.resume=u.state==='move'?{x:u.tx,y:u.ty}:null;u.state='attack';u.target=e;u.auto=true;u.anchor={x:u.x,y:u.y};}
    }
    switch(u.state){
      case 'move':if(this.step(u,u.tx,u.ty,dt,4)||(u.stuck>.3&&Math.hypot(u.tx-u.x,u.ty-u.y)<46)){u.state='idle';u.amove=false;u.moving=false;}break;
      case 'attack':{
        const t=u.target;
        if(!t||t.dead||(u.auto&&u.anchor&&Math.hypot(u.x-u.anchor.x,u.y-u.anchor.y)>320)||(u.team===0&&t.kind==='u'&&!t.vis&&u.auto)){
          u.target=null;u.auto=false;
          if(u.resume){u.state='move';u.amove=true;u.tx=u.resume.x;u.ty=u.resume.y;u.resume=null;}else u.state='idle';
          break;
        }
        const dist=this.edgeDist(t,u.x,u.y);
        if(dist<=D.range){u.face=t.x<u.x?-1:1;if(u.cd<=0){u.cd=D.cd;this.attack(u,t);}}
        else{const p=this.approach(t,u);this.step(u,p.x,p.y,dt,0);}
      }break;
      case 'gather':{
        let n=u.node;
        if(!n||n.dead||n.amt<=0){n=u.node=this.nearestNode(u.x,u.y);if(!n){u.state='idle';break;}}
        if(u.carry>0){u.state='return';break;}
        if(this.edgeDist(n,u.x,u.y)<=12){
          u.gT+=dt;u.swing=Math.sin(u.gT*10)>.6?.1:0;
          if(u.gT>=1.8){u.gT=0;const amt=Math.min(u.team?this.diff.carry:10,n.amt);n.amt-=amt;u.carry=amt;if(n.amt<=0)this.deplete(n);u.state='return';}
        }else{const p=this.approach(n,u);this.step(u,p.x,p.y,dt,0);}
      }break;
      case 'return':{
        const b=this.nearestDrop(u);if(!b){u.state='idle';break;}
        if(this.edgeDist(b,u.x,u.y)<=14){this.res[u.team]+=u.carry;u.carry=0;u.state='gather';if(u.team===0)this.sfx('deposit',u.x,u.y);}
        else{const p=this.approach(b,u);this.step(u,p.x,p.y,dt,0);}
      }break;
      case 'build':{
        const b=u.target;
        if(!b||b.dead||b.done){u.target=null;u.state=u.node&&!u.node.dead?'gather':'idle';break;}
        if(this.edgeDist(b,u.x,u.y)<=14){
          b.prog+=dt;b.hp=Math.min(b.max,b.hp+b.max*.9*dt/BLD[b.type].time);
          u.fxT-=dt;u.swing=u.fxT%0.6>0.3?.1:0;if(u.fxT<=0){u.fxT=1.4;this.float(u.x,u.y-48,'トントン','#ffffff',12);this.sfx('tonton',u.x,u.y);}
        }else{const p=this.approach(b,u);this.step(u,p.x,p.y,dt,0);}
      }break;
    }
  }
  attack(u,t){
    if(u.type==='kitsune'){this.shoot(u,t,'balloon',UNITS.kitsune.dmg);this.sfx('throw',u.x,u.y);return;}
    u.swing=.18;const h=HITS[u.type];this.damage(t,UNITS[u.type].dmg,u,h[(Math.random()*h.length)|0]);
    this.sfx(u.type==='shiba'?'men':'pat',t.x,t.y);
  }
  shoot(from,t,kind,dmg){
    const sx=from.x,sy=from.kind==='u'?from.y-30:from.y-from.h/2+20;
    const dist=Math.hypot(t.x-sx,t.y-sy);
    const p={sx,sy,t,lx:t.x,ly:t.y-(t.kind==='u'?20:0),time:0,dur:Math.max(.25,dist/(kind==='balloon'?260:420)),arc:kind==='balloon'?44:18,kind,dmg,from,team:from.team};
    p.spr=this.ig(this.add.image(sx,sy,kind).setDepth(8800));this.projs.push(p);
    if(kind==='chalk')this.sfx('chalk',sx,sy);
  }
  updProj(dt){
    for(const p of this.projs.slice()){
      p.time+=dt;if(!p.t.dead){p.lx=p.t.x;p.ly=p.t.y-(p.t.kind==='u'?20:0);}
      const k=Math.min(1,p.time/p.dur),x=p.sx+(p.lx-p.sx)*k,y=p.sy+(p.ly-p.sy)*k-Math.sin(Math.PI*k)*p.arc;
      p.spr.setPosition(x,y).setVisible(this.isVis(x,y,20));if(p.kind==='chalk')p.spr.angle+=900*dt;
      if(k>=1){
        rm(this.projs,p);p.spr.destroy();
        if(p.kind==='balloon'){this.splash(p.lx,p.ly);this.sfx('splash',p.lx,p.ly);}
        if(!p.t.dead)this.damage(p.t,p.dmg,p.from,HITS[p.kind==='balloon'?'kitsune':'chalk'][0],p.kind==='balloon'?'#9fdcff':'#ffffff');
      }
    }
  }
  splash(x,y){
    if(RM||!this.isVis(x,y))return;
    for(let i=0;i<7;i++){const d=this.ig(this.add.image(x,y,'drop').setDepth(8810));const a=Math.random()*Math.PI*2,r=rand(10,24);this.tweens.add({targets:d,x:x+Math.cos(a)*r,y:y+Math.sin(a)*r*.6-6,alpha:0,duration:380,ease:'Quad.easeOut',onComplete:()=>d.destroy()});}
  }
  damage(t,amt,by,label,col){
    if(t.dead)return;
    t.hp-=amt;this.float(t.x+rand(-8,8),(t.kind==='u'?t.y-46:t.y-t.h/2)+rand(-4,4),label,col||'#fff3b0',15);
    if(t.team===0&&this.t-this.alertT>9){this.alertT=this.t;this.alertPos={x:t.x,y:t.y};this.toast(t.kind==='b'?tr('toast.attackBld',{name:bn(t.type,'name')}):tr('toast.attackUnits'));SND.play('alarm');}
    if(by&&!by.dead&&by.kind==='u'){
      for(const o of this.units){
        if(o.team!==t.team||o.type==='tanuki'||o.state==='attack'||(o.state==='move'&&!o.amove))continue;
        if(Math.hypot(o.x-t.x,o.y-t.y)<230){o.resume=o.state==='move'?{x:o.tx,y:o.ty}:null;o.state='attack';o.target=by;o.auto=true;o.anchor={x:o.x,y:o.y};}
      }
    }
    if(t.hp<=0)this.kill(t);
  }
  kill(e){
    if(e.dead)return;e.dead=true;
    if(e.kind==='u'){
      rm(this.units,e);if(e.team===1)this.stats.ko++;
      this.float(e.x,e.y-44,'ばたんきゅ〜','#ffd1dc',14);this.sfx('faint',e.x,e.y);e.carrySpr.destroy();
      this.tweens.add({targets:e.spr,angle:e.face*90,alpha:0,y:e.y-8,duration:700,onComplete:()=>e.spr.destroy()});
    }else{
      rm(this.blds,e);
      this.float(e.x,e.y-e.h/2,e.type==='school'?'休校!':'ガラガラ…','#ffffff',e.type==='school'?24:17);this.sfx('collapse',e.x,e.y);
      this.tweens.add({targets:e.spr,alpha:0,scaleY:.5,duration:900,onComplete:()=>e.spr.destroy()});
      if(e.type==='school')this.endGame(e.team===1);
    }
    rm(this.sel,e);
  }
  deplete(n){n.dead=true;rm(this.nodes,n);rm(this.sel,n);n.spr.setTint(0xc8b086).setAlpha(.5);}
  updBld(b,dt){
    const d=BLD[b.type];
    if(!b.done){if(b.prog>=d.time){b.done=true;b.spr.setAlpha(1);if(b.team===0){this.toast(tr('toast.ready',{name:bn(b.type,'name')}));SND.play('ready');}}return;}
    if(b.queue.length){
      b.qT+=dt;const type=b.queue[0];
      if(b.qT>=UNITS[type].time){
        b.queue.shift();b.qT=0;
        const u=this.addUnit(type,b.team,b.x+rand(-30,30),b.y+b.h/2+16);
        if(b.team===0){this.stats.trained++;SND.play('trained');}
        if(b.rally){
          const r=b.rally,n=type==='tanuki'?this.pick(r.x,r.y):null;
          if(n&&n.kind==='n'){u.state='gather';u.node=n;}else{u.state='move';u.tx=r.x+rand(-14,14);u.ty=r.y+rand(-14,14);}
        }else if(type==='tanuki'){u.state='gather';}
        else{u.state='move';u.tx=b.x+rand(-50,50);u.ty=b.y+b.h/2+rand(40,70);}
      }
    }
    if(b.type==='school'){
      b.cd-=dt;
      if(b.cd<=0){
        let best=null,bd=210;
        for(const o of this.units){if(o.team===b.team)continue;const dd=this.edgeDist(b,o.x,o.y);if(dd<bd){bd=dd;best=o;}}
        if(best){b.cd=1.8;this.shoot(b,best,'chalk',6);}
      }
    }
  }
  separate(dt){
    const us=this.units,n=us.length;
    for(let i=0;i<n;i++){const a=us[i];for(let j=i+1;j<n;j++){const b=us[j];const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<324&&d2>0.0001){const d=Math.sqrt(d2),p=(18-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p;}}}
    const sol=this.solids();
    const push=(u,cx,cy,hw,hh)=>{const dx=u.x-cx,dy=u.y-cy;if(Math.abs(dx)<hw&&Math.abs(dy)<hh){if(hw-Math.abs(dx)<hh-Math.abs(dy))u.x=cx+(dx<0?-hw:hw);else u.y=cy+(dy<0?-hh:hh);}};
    for(const u of us){
      for(const b of this.blds)push(u,b.x,b.y,b.w/2+6,b.h/2+6);
      for(const p of sol)push(u,p.x,p.cy,p.w/2+8,p.h/2+8);
      u.x=clamp(u.x,10,W-10);u.y=clamp(u.y,24,H-8);
      if(u.moving&&u.want>0){const moved=Math.hypot(u.x-u.px,u.y-u.py);if(moved<u.want*.3)u.stuck+=dt;else u.stuck=Math.max(0,u.stuck-dt*2);if(u.stuck>.35&&u.detT<=0){u.detT=.7;u.detDir=Math.random()<.5?-1:1;u.stuck=.2;}}
      else u.stuck=0;
    }
  }
  train(b,type,silent){
    const U=UNITS[type],T=b.team;
    if(b.queue.length>=5){if(!silent){this.toast(tr('toast.queueFull'));SND.play('deny');}return false;}
    if(this.res[T]<U.cost){if(!silent){this.toast(tr('toast.poor',{name:un(type,'name'),cost:U.cost}));SND.play('deny');}return false;}
    if(this.popUsed(T)+1>this.popCap(T)){if(!silent){this.toast(tr('toast.popLimit'));SND.play('deny');}return false;}
    this.res[T]-=U.cost;b.queue.push(type);if(!silent)SND.play('select');return true;
  }

  /* ---------- enemy ---------- */
  findSpot(type,school){
    for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,r=180+Math.random()*280,x=school.x+Math.cos(a)*r,y=school.y+Math.sin(a)*r*.85;if(this.canPlace(type,x,y,1))return{x,y};}
    return null;
  }
  aiThink(){
    const me=1,school=this.blds.find(b=>b.team===me&&b.type==='school');if(!school)return;
    const my=this.units.filter(u=>u.team===me),workers=my.filter(u=>u.type==='tanuki'),army=my.filter(u=>u.type!=='tanuki');
    const mine=t=>this.blds.filter(b=>b.team===me&&b.type===t);
    const queued=t=>this.blds.reduce((s,b)=>s+(b.team===me?b.queue.filter(q=>q===t).length:0),0);
    workers.forEach(w=>{if(w.state==='idle')w.state='gather';});
    const wT=this.t<240?7:11;
    if(workers.length+queued('tanuki')<wT&&school.queue.length<2)this.train(school,'tanuki',true);
    let want=null;const pop=this.popUsed(me),cap=this.popCap(me);
    if(!mine('dojo').length)want='dojo';
    else if(cap-pop<=3&&cap<60&&!mine('vending').some(b=>!b.done))want='vending';
    else if(this.t>150&&!mine('konbini').length)want='konbini';
    else if(this.t>330&&mine('dojo').length<2)want='dojo';
    if(want&&this.res[me]>=BLD[want].cost){
      const s=this.findSpot(want,school);
      if(s){this.res[me]-=BLD[want].cost;const b=this.addBld(want,me,s.x,s.y,false);workers.filter(w=>w.state!=='build').slice(0,want==='vending'?1:2).forEach(w=>{w.state='build';w.target=b;});want=null;}
    }
    const reserve=want?BLD[want].cost*.6:0;
    for(const b of this.blds){
      if(b.team!==me||!b.done||b.type==='school'||!BLD[b.type].trains||b.queue.length>=2)continue;
      const ut=BLD[b.type].trains[0];if(this.res[me]-UNITS[ut].cost>=reserve)this.train(b,ut,true);
    }
    const intr=this.units.filter(u=>u.team===0&&Math.hypot(u.x-school.x,u.y-school.y)<560);
    if(intr.length)army.forEach(a=>{if(a.state!=='attack'&&!a.wave){let best=intr[0],bd=1e9;for(const o of intr){const d=Math.hypot(o.x-a.x,o.y-a.y);if(d<bd){bd=d;best=o;}}a.state='attack';a.target=best;a.auto=false;}});
    const home=army.filter(a=>!a.wave);
    if(this.t>=this.ai.nextWave&&(home.length>=this.ai.waveSize||(this.t>this.ai.nextWave+45&&home.length>=2))){
      const tgt=this.blds.find(b=>b.team===0&&b.type==='school')||this.blds.find(b=>b.team===0);
      if(tgt){home.forEach(a=>{a.wave=true;a.state='move';a.amove=true;a.tx=tgt.x+rand(-70,70);a.ty=tgt.y+tgt.h/2+rand(14,60);});this.ai.waveSize+=2;this.ai.nextWave=this.t+this.diff.gap;this.toast(tr('toast.wave'));SND.play('alarm');}
    }
    army.forEach(a=>{
      if(!a.wave||a.state!=='idle')return;
      let best=null,bd=1e9;for(const b of this.blds){if(b.team!==0)continue;const d=Math.hypot(b.x-a.x,b.y-a.y);if(d<bd){bd=d;best=b;}}
      if(best){a.state='move';a.amove=true;a.tx=best.x+rand(-40,40);a.ty=best.y+best.h/2+rand(14,40);}
    });
  }

  /* ---------- player input ---------- */
  setupInput(){
    const cam=this.cameras.main;
    this.input.mouse&&this.input.mouse.disableContextMenu();
    this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');
    const kb=this.input.keyboard;
    kb.on('keydown-ESC',()=>{if(this.placing)this.cancelPlace();else if(this.cmdMode)this.cmdMode=null;else this.select([]);});
    kb.on('keydown-SPACE',()=>cam.centerOn(this.home.x,this.home.y));
    kb.on('keydown-F',()=>{if(this.selUnits().some(u=>u.type!=='tanuki'))this.action('amove');});
    kb.on('keydown-E',()=>this.action('army'));
    kb.on('keydown-Q',()=>this.action('workers'));
    kb.on('keydown-P',()=>togglePause());
    this.input.on('pointerdown',p=>{
      this.lastTouch=!!p.wasTouch;
      if(!this.running||this.over||this.paused)return;
      const m=this.mini;
      if(p.x>=m.x&&p.x<=m.x+m.width&&p.y>=m.y&&p.y<=m.y+m.height){this.miniJump(p);this.drag={mini:true};return;}
      const wp=cam.getWorldPoint(p.x,p.y);
      this.drag={sx:p.x,sy:p.y,wx:wp.x,wy:wp.y,btn:p.button,touch:!!p.wasTouch,moved:false,scx:cam.scrollX,scy:cam.scrollY,shift:!!(p.event&&p.event.shiftKey)};
    });
    this.input.on('pointermove',p=>{
      if(!p.wasTouch)this.lastTouch=false;
      const wp=cam.getWorldPoint(p.x,p.y);
      if(this.placing&&!p.wasTouch)this.moveGhost(wp.x,wp.y);
      const d=this.drag;if(!d)return;
      if(d.mini){if(p.isDown)this.miniJump(p);return;}
      if(Math.hypot(p.x-d.sx,p.y-d.sy)>10)d.moved=true;
      if((d.touch||d.btn===1)&&d.moved){cam.scrollX=d.scx-(p.x-d.sx)/cam.zoom;cam.scrollY=d.scy-(p.y-d.sy)/cam.zoom;}
      d.cx=wp.x;d.cy=wp.y;
    });
    this.input.on('pointerup',p=>{
      const d=this.drag;this.drag=null;
      if(!d||d.mini||!this.running||this.over||this.paused)return;
      const wp=cam.getWorldPoint(p.x,p.y);
      if(d.touch){if(!d.moved)this.tap(wp.x,wp.y);return;}
      if(d.btn===2){if(this.placing){this.cancelPlace();return;}this.command(wp.x,wp.y,false);return;}
      if(d.btn!==0)return;
      if(this.placing){this.tryPlace(wp.x,wp.y);return;}
      if(this.cmdMode==='amove'){this.cmdMode=null;this.command(wp.x,wp.y,true);return;}
      if(d.moved){
        const x1=Math.min(d.wx,wp.x),x2=Math.max(d.wx,wp.x),y1=Math.min(d.wy,wp.y),y2=Math.max(d.wy,wp.y);
        const got=this.units.filter(u=>u.team===0&&u.x>=x1&&u.x<=x2&&u.y-16>=y1-16&&u.y-16<=y2);
        this.select(d.shift?[...new Set([...this.selUnits(),...got])]:got);if(got.length)SND.play('select');
      }else this.clickSelect(wp.x,wp.y,d.shift);
    });
    this.input.on('wheel',(p,o,dx,dy)=>{cam.setZoom(clamp(cam.zoom*(dy>0?.9:1.1),.45,1.5));});
    if(!this.canvasHooked){this.canvasHooked=true;const cv=this.game.canvas;cv.addEventListener('mouseenter',()=>this.mouseIn=true);cv.addEventListener('mouseleave',()=>this.mouseIn=false);}
  }
  miniJump(p){const m=this.mini;this.cameras.main.centerOn((p.x-m.x)/m.width*W,(p.y-m.y)/m.height*H);}
  camControls(dt){
    const cam=this.cameras.main,k=this.keys,sp=700*dt/cam.zoom;
    if(k.A.isDown||k.LEFT.isDown)cam.scrollX-=sp;if(k.D.isDown||k.RIGHT.isDown)cam.scrollX+=sp;
    if(k.W.isDown||k.UP.isDown)cam.scrollY-=sp;if(k.S.isDown||k.DOWN.isDown)cam.scrollY+=sp;
    if(this.mouseIn&&!this.lastTouch&&this.running&&!this.drag){
      const p=this.input.activePointer,sw=this.scale.width,sh=this.scale.height;
      if(p.x<10)cam.scrollX-=sp;else if(p.x>sw-10)cam.scrollX+=sp;
      if(p.y<10)cam.scrollY-=sp;else if(p.y>sh-10)cam.scrollY+=sp;
    }
    const p1=this.input.pointer1,p2=this.input.pointer2;
    if(p1&&p2&&p1.isDown&&p2.isDown){const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);if(this.pinchD)cam.setZoom(clamp(cam.zoom*d/this.pinchD,.45,1.5));this.pinchD=d;this.drag=null;}else this.pinchD=0;
  }
  select(arr){this.sel=arr.filter(e=>e&&!e.dead);this.cmdMode=null;this.renderPanel(true);}
  sameTypeInView(e){const v=this.cameras.main.worldView;return this.units.filter(u=>u.team===0&&u.type===e.type&&v.contains(u.x,u.y));}
  clickSelect(x,y,shift){
    const e=this.pick(x,y),now=this.time.now;
    if(e&&e.kind==='u'&&e.team===0){
      SND.play('select');
      if(this.lastClick.type===e.type&&now-this.lastClick.t<350){this.select(this.sameTypeInView(e));this.lastClick={t:0,type:null};return;}
      this.lastClick={t:now,type:e.type};
      if(shift){const s=this.selUnits();this.select(s.includes(e)?s.filter(u=>u!==e):[...s,e]);}else this.select([e]);
      return;
    }
    if(e&&e.team===0)SND.play('select');
    this.select(e?[e]:[]);
  }
  tap(x,y){
    if(this.placing){
      if(this.ghostAt&&Math.hypot(x-this.ghostAt.x,y-this.ghostAt.y)<50)this.tryPlace(this.ghostAt.x,this.ghostAt.y);
      else{this.moveGhost(x,y);this.toast(tr('toast.tapAgain'));}
      return;
    }
    if(this.cmdMode==='amove'){this.cmdMode=null;this.command(x,y,true);return;}
    const e=this.pick(x,y,8),us=this.selUnits();
    if(e&&e.team===0){
      if(e.kind==='b'&&us.length&&((!e.done&&us.some(u=>u.type==='tanuki'))||(BLD[e.type].drop&&us.some(u=>u.carry>0)))){this.command(x,y,false);return;}
      if(e.kind==='u'){const now=this.time.now;if(this.lastClick.type===e.type&&now-this.lastClick.t<350){this.select(this.sameTypeInView(e));this.lastClick={t:0,type:null};SND.play('select');return;}this.lastClick={t:now,type:e.type};}
      SND.play('select');this.select([e]);return;
    }
    if(us.length||(this.sel.length===1&&this.sel[0].kind==='b'&&this.sel[0].team===0&&!e)){this.command(x,y,false);return;}
    this.select(e?[e]:[]);
  }
  command(x,y,amove){
    const us=this.selUnits();
    if(!us.length){const b=this.sel[0];if(b&&b.kind==='b'&&b.team===0&&BLD[b.type].trains){b.rally={x,y};this.marker(x,y,0xf2c14e);this.toast(tr('toast.rally'));SND.play('order');}return;}
    SND.play('order');
    const e=this.pick(x,y,this.lastTouch?8:0);
    if(e&&e.kind!=='n'&&e.team===1){us.forEach(u=>{u.state='attack';u.target=e;u.auto=false;u.resume=null;});this.marker(e.x,e.kind==='u'?e.y:e.y+e.h/2,0xff6b5b);return;}
    const rest=[];
    for(const u of us){
      if(u.type==='tanuki'&&e){
        if(e.kind==='n'){u.state='gather';u.node=e;u.target=null;continue;}
        if(e.kind==='b'&&e.team===0&&!e.done){u.state='build';u.target=e;continue;}
        if(e.kind==='b'&&e.team===0&&BLD[e.type].drop&&u.carry>0){u.state='return';continue;}
      }
      rest.push(u);
    }
    const cols=Math.ceil(Math.sqrt(rest.length));
    rest.forEach((u,i)=>{const cx=(i%cols)-(cols-1)/2,cy=Math.floor(i/cols)-(Math.ceil(rest.length/cols)-1)/2;u.state='move';u.tx=x+cx*22;u.ty=y+cy*22;u.amove=!!amove;u.target=null;u.resume=null;u.stuck=0;u.detT=0;});
    this.marker(x,y,amove?0xff6b5b:0xa8f59a);this.renderPanel(true);
  }
  marker(x,y,col){
    const g=this.ig(this.add.graphics().setDepth(8990));g.lineStyle(3,col,1).strokeEllipse(0,0,34,14);g.setPosition(x,y);
    this.tweens.add({targets:g,scaleX:.3,scaleY:.3,alpha:0,duration:450,onComplete:()=>g.destroy()});
  }
  startPlace(type){
    const us=this.selUnits().filter(u=>u.type==='tanuki');
    if(this.res[0]<BLD[type].cost){this.toast(tr('toast.poor',{name:bn(type,'name'),cost:BLD[type].cost}));SND.play('deny');return;}
    this.cancelPlace();this.placing=type;this.placers=us;
    this.ghost=this.ig(this.add.image(0,0,type+'0').setAlpha(.65).setDepth(9100));
    const v=this.cameras.main.worldView;this.moveGhost(v.centerX,v.centerY);
    this.toast(tr(this.lastTouch?'toast.placeTouch':'toast.placeMouse'));
    this.renderPanel(true);
  }
  moveGhost(x,y){if(!this.ghost)return;x=Math.round(x/8)*8;y=Math.round(y/8)*8;const ok=this.canPlace(this.placing,x,y);this.ghost.setPosition(x,y).setTint(ok?0xffffff:0xff7777);this.ghostAt={x,y,ok};}
  tryPlace(x,y){
    x=Math.round(x/8)*8;y=Math.round(y/8)*8;const t=this.placing,d=BLD[t];
    if(!this.canPlace(t,x,y)){this.moveGhost(x,y);this.toast(tr('toast.noPlace'));SND.play('deny');return;}
    if(this.res[0]<d.cost){this.toast(tr('toast.poorShort'));this.cancelPlace();return;}
    this.res[0]-=d.cost;const b=this.addBld(t,0,x,y,false);SND.play('place');
    let ws=(this.placers||[]).filter(u=>!u.dead);
    if(!ws.length){const all=this.units.filter(u=>u.team===0&&u.type==='tanuki').sort((a,c)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(c.x-x,c.y-y));ws=all.slice(0,1);}
    ws.forEach(u=>{u.state='build';u.target=b;});
    this.cancelPlace();
  }
  cancelPlace(){if(this.ghost)this.ghost.destroy();this.ghost=null;this.ghostAt=null;this.placing=null;this.placers=null;this.renderPanel(true);}
  action(a){
    if(!this.running||this.over)return;
    const [k,v]=a.split(':');
    if(k==='build')this.startPlace(v);
    else if(k==='train'){const b=this.sel[0];if(b&&b.kind==='b')this.train(b,v);}
    else if(k==='cancel')this.cancelPlace();
    else if(k==='stop'){this.selUnits().forEach(u=>{u.state='idle';u.target=null;u.amove=false;});SND.play('order');}
    else if(k==='amove'){this.cmdMode=this.cmdMode==='amove'?null:'amove';if(this.cmdMode)this.toast(tr(this.lastTouch?'toast.amoveTouch':'toast.amoveMouse'));}
    else if(k==='workers'){this.select(this.units.filter(u=>u.team===0&&u.type==='tanuki'));SND.play('select');return;}
    else if(k==='army'){this.select(this.units.filter(u=>u.team===0&&u.type!=='tanuki'));SND.play('select');return;}
    else if(k==='home')this.cameras.main.centerOn(this.home.x,this.home.y);
    this.renderPanel(true);
  }

  /* ---------- presentation ---------- */
  float(x,y,s,color,size){
    if(!this.isVis(x,y,40))return;
    const t=this.ig(this.add.text(x,y,s,{fontFamily:FONT,fontSize:size+'px',fontStyle:'800',color,stroke:'#3a2a20',strokeThickness:4}).setOrigin(.5).setDepth(9200));
    this.tweens.add({targets:t,y:y-26,alpha:0,duration:900,ease:'Cubic.easeOut',onComplete:()=>t.destroy()});
  }
  toast(m){showToast(m);}
  makePetals(){
    this.petals=[];if(RM)return;
    for(let i=0;i<22;i++){const p=this.ig(this.add.image(0,0,'petal').setScrollFactor(0).setDepth(9050).setAlpha(.85));p.vx=rand(18,40);p.vy=rand(22,46);p.ph=Math.random()*6;p.setPosition(Math.random()*this.scale.width,Math.random()*this.scale.height);this.petals.push(p);}
  }
  updPetals(dt){
    if(!this.petals.length)return;
    const cam=this.cameras.main,sw=this.scale.width,sh=this.scale.height,z=cam.zoom,hx=sw/(2*z),hy=sh/(2*z),x0=sw/2-hx,x1=sw/2+hx,y0=sh/2-hy,y1=sh/2+hy;
    for(const p of this.petals){p.ph+=dt;p.x+=(p.vx+Math.sin(p.ph*2)*14)*dt/z;p.y+=p.vy*dt/z;p.angle+=60*dt;if(p.x>x1)p.x=x0;if(p.y>y1){p.y=y0;p.x=rand(x0,x1);}if(p.x<x0)p.x=x1;}
  }
  bar(g,x,y,w,f,col){g.fillStyle(0x2b2621,.85);g.fillRect(x-w/2-1,y-1,w+2,6);g.fillStyle(col,1);g.fillRect(x-w/2,y,w*clamp(f,0,1),4);}
  draw(){
    const gS=this.gS,gT=this.gT,now=this.time.now/1000,sel=new Set(this.sel);
    gS.clear();gT.clear();
    for(const n of this.nodes)if(sel.has(n)){gS.lineStyle(3,0xfff4a0,1);gS.strokeRect(n.x-n.w/2-3,n.y-n.h/2-3,n.w+6,n.h+6);}
    for(const b of this.blds){
      const show=this.shown(b);b.spr.setVisible(show);if(!show)continue;
      const live=b.team===0||b.vis;
      gS.fillStyle(0x000000,.16);gS.fillEllipse(b.x,b.y+b.h/2-4,b.w*.95,16);
      if(sel.has(b)){gS.lineStyle(3,b.team?0xff9a8a:0xa8f59a,1);gS.strokeRect(b.x-b.w/2-4,b.y-b.h/2-4,b.w+8,b.h+8);}
      if(!live)continue;
      const top=b.y-b.h/2-12,bw=Math.min(b.w,90);
      if(!b.done)this.bar(gT,b.x,top,bw,b.prog/BLD[b.type].time,0xf2c14e);
      else if(b.hp<b.max||sel.has(b))this.bar(gT,b.x,top,bw,b.hp/b.max,b.team?0x8fa8e0:0x7fd07a);
      if(b.done&&b.queue.length&&b.team===0)this.bar(gT,b.x,top+7,Math.min(b.w,70),b.qT/UNITS[b.queue[0]].time,0x9fd3ff);
      if(sel.has(b)&&b.rally){gT.lineStyle(2,0xf2c14e,.8);gT.lineBetween(b.x,b.y+b.h/2,b.rally.x,b.rally.y);gT.fillStyle(0xf2c14e,1);gT.fillTriangle(b.rally.x,b.rally.y-24,b.rally.x+14,b.rally.y-18,b.rally.x,b.rally.y-12);gT.lineStyle(2,0x3b2a1f,1);gT.lineBetween(b.rally.x,b.rally.y,b.rally.x,b.rally.y-24);}
    }
    for(const u of this.units){
      const show=this.shown(u);u.spr.setVisible(show);u.carrySpr.setVisible(show&&u.carry>0);if(!show)continue;
      const bob=u.moving&&!RM?Math.abs(Math.sin(now*13+u.bob))*3:0;
      const fr=u.moving?(Math.floor(now*8+u.bob)%2):0;
      if(fr!==u.fr){u.fr=fr;u.spr.setTexture(u.type+u.team+'_'+fr);}
      u.spr.setPosition(u.x,u.y-bob).setDepth(u.y).setFlipX(u.face<0);u.spr.angle=u.swing>0?u.face*16:0;
      u.carrySpr.setPosition(u.x,u.y-58-bob).setDepth(u.y+1);
      gS.fillStyle(0x000000,.2);gS.fillEllipse(u.x,u.y+1,24,8);
      gS.lineStyle(2,TEAMS[u.team].ring,.85);gS.strokeEllipse(u.x,u.y+1,26,10);
      if(sel.has(u)){gS.lineStyle(2.5,u.team?0xff9a8a:0xa8f59a,1);gS.strokeEllipse(u.x,u.y+1,34,14);}
      if(u.hp<u.max||sel.has(u))this.bar(gT,u.x,u.y-62,26,u.hp/u.max,u.team?0x8fa8e0:0x7fd07a);
    }
    const d=this.drag;
    if(d&&!d.mini&&!d.touch&&d.btn===0&&d.moved&&d.cx!=null&&!this.placing){gT.lineStyle(1.5,0xa8f59a,1);gT.fillStyle(0xa8f59a,.12);const x=Math.min(d.wx,d.cx),y=Math.min(d.wy,d.cy),w=Math.abs(d.cx-d.wx),h=Math.abs(d.cy-d.wy);gT.fillRect(x,y,w,h);gT.strokeRect(x,y,w,h);}
    const m=this.gMini;m.clear();
    m.fillStyle(0xe2c76a,1);for(const n of this.nodes)if(this.shown(n))m.fillRect(n.x-n.w/2,n.y-n.h/2,n.w,n.h);
    for(const b of this.blds){if(!this.shown(b))continue;const w=Math.max(b.w,90),h=Math.max(b.h,90);m.fillStyle(TEAMS[b.team].mini,1);m.fillRect(b.x-w/2,b.y-h/2,w,h);m.lineStyle(12,0x2b2621,1);m.strokeRect(b.x-w/2,b.y-h/2,w,h);}
    for(const u of this.units){if(!this.shown(u))continue;m.fillStyle(TEAMS[u.team].mini,1);m.fillRect(u.x-28,u.y-28,56,56);}
    if(this.alertPos&&this.t-this.alertT<4){m.lineStyle(40,0xf2c14e,1-(this.t-this.alertT)/4);m.strokeCircle(this.alertPos.x,this.alertPos.y,160+((now*300)%180));}
    m.lineStyle(48,0x7b5330,1);m.strokeRect(0,0,W,H);
    const v=this.cameras.main.worldView;this.gView.clear().lineStyle(30,0xffffff,.95).strokeRect(v.x,v.y,v.width,v.height);
  }
  update(time,delta){
    const rdt=Math.min(delta/1000,.05);
    this.camControls(rdt);this.updPetals(rdt);
    if(this.running&&!this.over&&!this.paused){
      const dt=rdt;this.t+=dt;
      for(const u of this.units.slice())if(!u.dead)this.updUnit(u,dt);
      this.separate(dt);
      for(const b of this.blds.slice())if(!b.dead)this.updBld(b,dt);
      this.updProj(dt);
      this.aiT+=dt;if(this.aiT>=this.diff.think){this.aiT=0;this.aiThink();}
      this.fogT+=dt;if(this.fogT>=.12){this.fogT=0;this.updFog();}
      this.hudT+=dt;if(this.hudT>.15){this.hudT=0;this.hud();this.renderPanel(false);}

    this.draw();
  }
  hud(){
    $('#res').textContent=Math.floor(this.res[0]);
    $('#pop').textContent=this.popUsed(0)+'/'+this.popCap(0);
    $('#clock').textContent=fmtTime(this.t);
  }
  renderPanel(force){
    this.sel=this.sel.filter(e=>!e.dead);
    const s=this.sel,own=this.selUnits(),one=s.length===1?s[0]:null;
    const sig=[s.map(e=>e.id).join(','),one&&one.kind==='b'?(one.done?'d':'u')+one.queue.join(''):'',this.placing,this.cmdMode,own.map(u=>u.type).join(''),LANG].join('|');
    if(!force&&sig===this.sig){this.refreshPanel();return;}
    this.sig=sig;
    let selH='',actH='';
    const costBtn=(act,img,name,cost,extra)=>`<button type="button" class="act" data-act="${act}" data-cost="${cost}"><img src="${img}" alt=""><span>${name}<small>${ONI_SVG}${cost}${extra?' · '+extra:''}</small></span></button>`;
    const plainBtn=(act,label,on)=>`<button type="button" class="act plain${on?' on':''}" data-act="${act}">${label}</button>`;
    const who=(img,name,sub,desc,e)=>`<div class="who"><img src="${img}" alt=""><div><h2>${name}</h2><p class="role">${sub}</p><div class="hp${e.team?' enemy':''}"><i data-hp></i></div>${desc?`<p class="muted desc">${desc}</p>`:''}</div></div>`;
    if(this.placing){
      selH=`<div class="who"><img src="${PORT[this.placing+'0']}" alt=""><div><h2>${tr('p.placing',{name:bn(this.placing,'name')})}</h2><p class="muted">${tr(this.lastTouch?'p.placingTouch':'p.placingMouse')}</p></div></div>`;
      actH=plainBtn('cancel',tr('p.cancel'));
    }else if(own.length){
      if(own.length===1){const u=own[0];selH=who(PORT[u.type+'0'],un(u.type,'name'),un(u.type,'role'),un(u.type,'desc'),u);}
      else{
        const g={};own.forEach(u=>g[u.type]=(g[u.type]||0)+1);
        selH=`<h2>${own.length} ${(PLURAL[LANG]||PLURAL.en)(own.length)}</h2><div class="chips">${Object.keys(g).map(t=>`<span class="chip"><img src="${PORT[t+'0']}" alt="">×${g[t]}</span>`).join('')}</div>`;
      }
      if(own.some(u=>u.type==='tanuki'))for(const t of ['dojo','konbini','vending'])actH+=costBtn('build:'+t,PORT[t+'0'],bn(t,'name'),BLD[t].cost);
      if(own.some(u=>u.type!=='tanuki'))actH+=plainBtn('amove',tr('p.amove'),this.cmdMode==='amove');
      actH+=plainBtn('stop',tr('p.stop'));
    }else if(one&&one.kind==='b'){
      const d=BLD[one.type];
      selH=who(PORT[one.type+one.team],bn(one.type,'name'),one.team?tr('p.teamE'):(one.done?tr('p.teamP'):tr('p.building')),bn(one.type,'desc'),one);
      if(!one.done)selH+=`<p class="muted">${tr('p.progress',{p:'<b data-prog>0</b>'})}</p>`;
      if(one.team===0&&one.done&&d.trains){
        d.trains.forEach(t=>actH+=costBtn('train:'+t,PORT[t+'0'],un(t,'name'),UNITS[t].cost,UNITS[t].time+' '+tr('p.sec')));
        actH+=`<div class="queue">${one.queue.map((q,i)=>`<span class="qi"><img src="${PORT[q+'0']}" alt="">${i===0?'<i data-q></i>':''}</span>`).join('')||`<span class="muted">${tr(this.lastTouch?'p.rallyTouch':'p.rallyMouse')}</span>`}</div>`;
      }
    }else if(one&&one.kind==='u'){
      selH=who(PORT[one.type+one.team],un(one.type,'name'),tr('p.enemyPrefix')+un(one.type,'role'),un(one.type,'desc'),one);
    }else if(one&&one.kind==='n'){
      selH=`<h2>${tr('p.node')}</h2><p class="muted">${tr('p.nodeText',{amt:`<b data-amt>${one.amt}</b>`})}</p>`;
    }else{
      selH=`<h2>${tr('p.idle')}</h2><p class="muted">${tr(this.lastTouch?'p.idleTouch':'p.idleMouse')} ${tr('p.goal')}</p>`;

  refreshPanel(){
    const one=this.sel.length===1?this.sel[0]:null;

    const pr=document.querySelector('#sel [data-prog]');if(pr&&one&&one.kind==='b')pr.textContent=Math.floor(100*clamp(one.prog/BLD[one.type].time,0,1));
    const q=document.querySelector('#actions [data-q]');if(q&&one&&one.queue&&one.queue.length)q.style.width=(100*clamp(one.qT/UNITS[one.queue[0]].time,0,1))+'%';
    const am=document.querySelector('#sel [data-amt]');if(am&&one&&one.kind==='n')am.textContent=one.amt;
    document.querySelectorAll('#actions [data-cost]').forEach(b=>b.classList.toggle('poor',this.res[0]<+b.dataset.cost));
  }
  endGame(win){
    if(this.over)return;this.over=true;this.cancelPlace();
    SND.stopMusic();
    this.time.delayedCall(700,()=>{if(win)SND.bell(['E5','C5','D5','G4','G4','D5','E5','C5'],.5);else SND.bell(['C5','A4','B4','E4'],.75,true);});
    this.time.delayedCall(1100,()=>{
      this.endWin=win;fillEnd();
      $('#stTime').textContent=fmtTime(this.t);$('#stTrained').textContent=this.stats.trained;$('#stKo').textContent=this.stats.ko;
      $('#end').hidden=false;
    });
  }
}

/* ---------- page wiring ---------- */
function fmtTime(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
let toastTimer;
function showToast(m){const el=$('#toast');el.textContent=m;el.hidden=false;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600);}
function fillPortraits(){document.querySelectorAll('[data-port]').forEach(i=>{i.src=PORT[i.dataset.port]||'';});}
function togglePause(){if(!SCN||!SCN.running||SCN.over)return;SCN.paused=!SCN.paused;SND.pause(SCN.paused);$('#pauseBanner').hidden=!SCN.paused;$('#pause').textContent=tr(SCN.paused?'hud.resume':'hud.pause');}
function fillEnd(){if(!SCN||SCN.endWin==null)return;const w=SCN.endWin;$('#endEyebrow').textContent=tr(w?'end.winEyebrow':'end.loseEyebrow');$('#endTitle').textContent=tr(w?'end.winTitle':'end.loseTitle');$('#endText').textContent=tr(w?'end.winText':'end.loseText');}
function syncHudHeight(){const h=$('#hud').offsetHeight;document.documentElement.style.setProperty('--hud-h',h+'px');if(SCN&&SCN.mini)SCN.layoutMini();}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=tr(e.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-title]').forEach(e=>e.title=tr(e.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.i18nAria)));
  document.querySelectorAll('[data-lang-group]').forEach(g=>{g.setAttribute('aria-label',tr('lang.aria'));g.innerHTML=LANGS.map(l=>`<button type="button" data-lang="${l.code}" aria-pressed="${l.code===LANG}">${l.label}</button>`).join('');});
  $('#pause').textContent=tr(SCN&&SCN.paused?'hud.resume':'hud.pause');
  fillEnd();
  if(SCN&&SCN.sel){SCN.sig='';SCN.renderPanel(true);}
  syncHudHeight();
}
function setLang(code){if(!I18N[code])return;LANG=code;store.set('undokai.lang',code);applyLang();}
function syncSoundButtons(){$('#sfxBtn').setAttribute('aria-pressed',String(SND.sfxOn));$('#musBtn').setAttribute('aria-pressed',String(SND.musOn));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)setLang(b.dataset.lang);});
$('#sfxBtn').addEventListener('click',()=>{SND.init();SND.setSfx(!SND.sfxOn);syncSoundButtons();if(SND.sfxOn)SND.play('select');});
$('#musBtn').addEventListener('click',()=>{SND.init();SND.setMusic(!SND.musOn);syncSoundButtons();if(SCN&&SCN.running&&!SCN.over)SND.startMusic();});
$('#actions').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&SCN)SCN.action(b.dataset.act);});
$('#pause').addEventListener('click',togglePause);
document.querySelectorAll('.diff button').forEach(b=>b.addEventListener('click',()=>{chosenDiff=b.dataset.diff;document.querySelectorAll('.diff button').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));}));
const startGame=()=>{SND.init();SND.stopMusic();if(SCN)SCN.scene.restart({diff:chosenDiff,run:true});};
$('#go').addEventListener('click',startGame);
$('#again').addEventListener('click',startGame);
window.addEventListener('resize',syncHudHeight);
